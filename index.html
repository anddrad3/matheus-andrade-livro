<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Matheus Andrade — Desenvolvedor Full Stack</title>
    <meta name="description" content="Portfólio de Matheus da Silva Andrade — desenvolvedor full stack, professor e pesquisador. Um livro sobre código, educação e pesquisa acadêmica." />
    <meta name="theme-color" content="#0b0807" />
    <meta property="og:title" content="Matheus Andrade — Desenvolvedor Full Stack" />
    <meta property="og:description" content="Um livro sobre código, educação e pesquisa acadêmica: Ameríndia, Voz do Professor, MLG e mais." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231d1410'/%3E%3Crect x='5' y='5' width='54' height='54' rx='6' fill='none' stroke='%23c9a45c' stroke-width='1.5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='28' fill='%23e8c97a'%3EMA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Caveat:wght@500;600&family=Pirata+One&family=Cinzel:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('livro.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark'; // padrão: Edição Sombria
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="backdrop" aria-hidden="true"></div>
    <canvas id="dust" aria-hidden="true"></canvas>
    <div id="spot" aria-hidden="true"></div>

    <main id="stage" aria-label="Livro: Matheus Andrade, Desenvolvedor Front-end">
      <div id="rig">
        <div id="float">
          <div id="camera">
            <div class="desk" aria-hidden="true">
              <div class="desk-wood"></div>
              <div class="prop prop-ring"></div>
              <div class="prop prop-glasses">
                <svg viewBox="0 0 230 92"><g fill="rgba(235,225,200,.07)" stroke="#b8924c" stroke-width="3.2"><circle cx="58" cy="50" r="38"/><circle cx="172" cy="50" r="38"/></g><path d="M96 46q19-14 38 0" fill="none" stroke="#b8924c" stroke-width="3.2"/><path d="M20 44L4 30M210 44l16-14" stroke="#b8924c" stroke-width="3" stroke-linecap="round"/><path d="M36 30q14-10 30-6M150 30q14-10 30-6" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/></svg>
              </div>
              <div class="prop prop-pen">
                <svg viewBox="0 0 420 34"><defs><linearGradient id="pen-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset=".35" stop-color="#14100e"/><stop offset="1" stop-color="#050404"/></linearGradient><linearGradient id="pen-au" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".5" stop-color="#b8863a"/><stop offset="1" stop-color="#6e4a14"/></linearGradient></defs><path d="M60 17L8 11q-6 6 0 12z" fill="url(#pen-au)"/><path d="M10 17h42" stroke="#5a3d10" stroke-width="1"/><rect x="58" y="6" width="330" height="22" rx="11" fill="url(#pen-g)"/><rect x="200" y="6" width="9" height="22" fill="url(#pen-au)"/><rect x="214" y="6" width="3" height="22" fill="url(#pen-au)"/><rect x="250" y="2" width="120" height="6" rx="3" fill="url(#pen-au)"/><circle cx="388" cy="17" r="10.5" fill="url(#pen-au)"/><path d="M70 10h300" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="round"/></svg>
              </div>
              <div class="prop prop-note"><span>leia-me</span><svg viewBox="0 0 60 40"><path d="M4 30q22 4 46-20M38 8l13 1-3 12" fill="none" stroke="#2a4a8a" stroke-width="2.4" stroke-linecap="round"/></svg></div>
              <div class="prop prop-whisky"><svg viewBox="0 0 120 120"><defs><radialGradient id="wk-liq" cx=".42" cy=".4" r=".62"><stop offset="0" stop-color="#e3a04a"/><stop offset=".55" stop-color="#b8661f"/><stop offset="1" stop-color="#6b300c"/></radialGradient><radialGradient id="wk-glass" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></radialGradient></defs><circle cx="60" cy="60" r="55" fill="url(#wk-glass)" stroke="rgba(255,255,255,.42)" stroke-width="3"/><circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle class="wk-liquid" cx="60" cy="60" r="45" fill="url(#wk-liq)" opacity=".9"/><g fill="rgba(255,255,255,.32)" stroke="rgba(255,255,255,.7)" stroke-width="1.4"><rect x="40" y="40" width="22" height="22" rx="4" transform="rotate(18 51 51)"/><rect x="60" y="56" width="20" height="20" rx="4" transform="rotate(-24 70 66)"/></g><path d="M30 42a36 36 0 0 1 22-17" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-linecap="round"/></svg></div>
              <div class="prop prop-ashtray"><svg viewBox="0 0 170 120"><defs><radialGradient id="as-ember" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0"/><stop offset=".35" stop-color="#ff8a2a"/><stop offset="1" stop-color="#ff4d10" stop-opacity="0"/></radialGradient></defs><circle cx="58" cy="62" r="50" fill="rgba(28,28,30,.88)" stroke="rgba(220,225,235,.55)" stroke-width="3"/><circle cx="58" cy="62" r="38" fill="rgba(12,12,13,.9)" stroke="rgba(220,225,235,.18)" stroke-width="2"/><g fill="rgba(150,150,150,.55)"><circle cx="46" cy="70" r="6"/><circle cx="56" cy="76" r="4"/><circle cx="62" cy="54" r="3"/><circle cx="40" cy="58" r="3.5"/></g><path d="M16 62h-6M100 62h6M58 20v-6M58 104v6" stroke="rgba(220,225,235,.5)" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-8 100 62)"><rect x="72" y="57" width="58" height="10" rx="2" fill="#f2efe8"/><rect x="130" y="57" width="24" height="10" rx="2" fill="#c98b4a"/><g fill="#a86a2e"><circle cx="135" cy="60" r=".9"/><circle cx="141" cy="64" r=".9"/><circle cx="147" cy="59.5" r=".9"/><circle cx="151" cy="64" r=".9"/></g><rect x="64" y="57.5" width="9" height="9" rx="1.5" fill="#9a9a9a"/><circle class="as-ember" cx="64" cy="62" r="9" fill="url(#as-ember)"/></g><g class="as-smoke" fill="none" stroke="rgba(225,228,236,.42)" stroke-width="2.2" stroke-linecap="round"><path d="M62 56c-6-8 6-12 0-20s6-12 0-22"/><path d="M66 54c5-7-5-12 1-19s-4-12 2-20" opacity=".7"/></g></svg></div>
              <div class="desk-light"></div>
            </div>
            <div id="book">
              <div class="book-shadow" aria-hidden="true"></div>
              <div class="edges" aria-hidden="true">
                <div class="edge edge-spine"><span>Matheus Andrade</span></div>
                <div class="edge edge-fore"></div>
                <div class="edge edge-top"></div>
                <div class="edge edge-bottom"></div>
              </div>
              <div class="blocks" aria-hidden="true">
                <div class="block block-l"><i class="bs bs-fore"></i><i class="bs bs-spine"></i><i class="bs bs-top"></i><i class="bs bs-bottom"></i></div>
                <div class="block block-r"><i class="bs bs-fore"></i><i class="bs bs-spine"></i><i class="bs bs-top"></i><i class="bs bs-bottom"></i></div>
              </div>
              <div class="leaves"></div>
              <div class="cast" aria-hidden="true"><i class="cast-l"></i><i class="cast-r"></i></div>
              <a class="ribbon" href="#sumario" data-goto="4" aria-label="Marcador: voltar ao sumário"><span></span></a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="ui">
      <header class="ui-top">
        <a class="ui-mark" href="./" data-home aria-label="Início: fechar o livro e voltar à capa" title="Voltar à capa">
          <span class="ui-mono">M<i>·</i>A</span>
        </a>
        <nav class="ui-links" aria-label="Atalhos">
          <a href="#sumario" data-goto="4" data-nav="sumario">Sumário</a>
          <a href="#obras" data-goto="9" data-nav="obras">Obras</a>
          <a href="#epilogo" data-goto="18" data-nav="epilogo">Contato</a>
          <button id="spin" class="ui-sound ui-spin" type="button" aria-label="Girar o livro em 360 graus" aria-pressed="false" title="Arraste para girar"><svg class="spin-ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M18.6 14.9l2.4.3-.9 2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="6" width="6" height="12" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span>360°</span></button>
          <button id="theme" class="ui-sound ui-theme" type="button" aria-label="Alternar tema claro e escuro"><svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M16 4.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6Z" fill="currentColor"/></svg><span class="snd-label theme-label">tema</span></button>
          <button id="sound" class="ui-sound" type="button" aria-label="Som das páginas" aria-pressed="true"><span class="snd-bars"><i></i><i></i><i></i><i></i></span><span class="snd-label">som</span></button>
          <div class="vol-wrap">
  <button id="music" class="ui-sound ui-music" type="button" aria-label="Trilha sonora" aria-pressed="false" title="Trilha sonora"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.6" cy="17.6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="16.6" cy="15.6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="snd-label">música</span></button>
            <div id="vol-pop" class="vol-pop" hidden>
              <span class="vol-title">trilha</span>
              <button id="vol-mute" class="vol-mute" type="button" aria-label="Silenciar a trilha">mudo</button>
              <input id="vol" class="vol-range" type="range" min="0" max="100" step="1" value="55" aria-label="Volume da trilha" />
              <output id="vol-out" class="vol-out">55</output>
            </div>
          </div>
          <button id="replay" class="ui-sound ui-replay" type="button" aria-label="Reiniciar a abertura" title="Reiniciar a abertura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4 3.8v4.4h4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 9.2v5.6l4.6-2.8Z" fill="currentColor"/></svg><span class="snd-label">abertura</span></button>
        </nav>
        <button id="menu-btn" class="ui-menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu"><span class="mb-lines"><i></i><i></i><i></i></span><em>menu</em></button>
      </header>
      <footer class="ui-bottom">
        <button id="prev" class="ui-arrow" type="button" aria-label="Página anterior">
          <svg viewBox="0 0 40 12" aria-hidden="true"><path d="M40 6H2M7 1L2 6l5 5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          <span>anterior</span>
        </button>
        <div class="ui-folio">
          <span id="folio-chapter">Sumário</span>
          <span id="folio-num"></span>
          <span class="ui-progress"><span id="progress-bar"></span></span>
        </div>
        <button id="next" class="ui-arrow" type="button" aria-label="Próxima página">
          <span>próxima</span>
          <svg viewBox="0 0 40 12" aria-hidden="true"><path d="M0 6h38M33 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </footer>
    </div>

    <button id="prompt" type="button">
      <span class="prompt-line"></span>
      <span class="prompt-text">Toque para abrir</span>
      <span class="prompt-line"></span>
    </button>
    <div id="cine" aria-hidden="true">
      <div class="cine-veil"></div>
      <i class="cine-bar cine-top"></i>
      <i class="cine-bar cine-bottom"><span class="cine-place">Franca, São Paulo &nbsp;·&nbsp; MMXXVI</span></i>
      <div class="cine-title"><span class="ct-pre">um livro de</span><span class="ct-name">Matheus Andrade</span></div>
    </div>
    <div id="spin-hint" aria-hidden="true">modo 360° · arraste para girar o livro</div>
    <button id="spin-exit" class="spin-exit" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4.5 12H15a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>voltar ao livro</button>
    <button id="skip" type="button">Pular abertura <kbd>Esc</kbd></button>

    <div id="loader" aria-hidden="true">
      <span class="loader-orn">❦</span>
      <span class="loader-text">Encadernando o volume</span>
    </div>

    <div class="grain" aria-hidden="true"></div>
    <div id="theme-veil" aria-hidden="true"></div>
    <button id="music-hint" class="music-hint" type="button" hidden>♪ toque em qualquer lugar para ouvir a trilha</button>

    <!-- objetos da mesa (depois da abertura): clique e eles falam -->
    <div id="desk-props" aria-label="Objetos da mesa">
      <button class="dp dp-glasses" type="button" data-prop="glasses" aria-label="Óculos de trabalho"></button>
      <button class="dp dp-ring" type="button" data-prop="ring" aria-label="Marca de café ou vela"><i class="dp-flame"></i></button>
      <button class="dp dp-pen" type="button" data-prop="pen" aria-label="Caneta-tinteiro"></button>
      <button class="dp dp-note" type="button" data-prop="note" aria-label="Bilhete leia-me"></button>
      <button class="dp dp-whisky" type="button" data-prop="whisky" aria-label="Copo de whisky"></button>
      <button class="dp dp-ashtray" type="button" data-prop="ashtray" aria-label="Cigarro no cinzeiro"></button>
    </div>
    <div id="talk" class="talk" role="status" aria-live="polite" hidden>
      <p class="talk-name"></p>
      <p class="talk-text"></p>
      <span class="talk-more">clique de novo ↻</span>
    </div>

    <!-- menu do celular -->
    <div id="menu" class="menu-sheet" hidden>
      <div class="menu-scrim" data-menu-close></div>
      <div class="menu-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="menu-head"><span class="menu-title">Sumário</span><button class="menu-close" type="button" data-menu-close aria-label="Fechar menu">✕</button></div>
        <ol class="menu-chapters"></ol>
        <p class="menu-sub">Objetos da mesa</p>
        <div class="menu-props"></div>
        <p class="menu-sub">Ajustes</p>
        <div class="menu-toggles">
          <button type="button" data-proxy="theme"><span class="mt-ico">◐</span><span class="mt-label">tema</span><span class="mt-state" data-state="theme"></span></button>
          <div class="menu-vol"><span class="mt-ico">♪</span><span class="mt-label">música</span><input id="vol-m" class="vol-range" type="range" min="0" max="100" step="1" value="55" aria-label="Volume da trilha" /><button id="vol-mute-m" type="button" class="mt-state">mudo</button></div>
          <button type="button" data-proxy="sound"><span class="mt-ico">♫</span><span class="mt-label">som das páginas</span><span class="mt-state" data-state="sound"></span></button>
          <button type="button" data-proxy="spin"><span class="mt-ico">⟳</span><span class="mt-label">girar 360°</span><span class="mt-state" data-state="spin"></span></button>
          <button type="button" data-proxy="replay"><span class="mt-ico">↺</span><span class="mt-label">reiniciar abertura</span><span class="mt-state"></span></button>
        </div>
      </div>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>

    <noscript>
      <p style="color:#e8dcc0;font-family:Georgia,serif;text-align:center;padding:3rem">Este livro precisa de JavaScript para ser folheado.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
